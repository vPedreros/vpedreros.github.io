# =========================
# YAML Configuration File
# _config.yml
# =========================

# _config.yml sets the whole site configuration for Jekyll, which is based on Ruby.
# This file controls how your website looks, behaves, and what information it displays.

# ===========================================================================
# 1. Site Basic Engine (Jekyll Core Settings)
# ===========================================================================

lang: en # Options: 'en' (English), 'ko' or 'ko-KR' (Korean) etc.
timezone: Australia/Brisbane # Format: Area/City (e.g., Asia/Seoul, America/New_York)

# ===========================================================================
# 2. Page Structure & Content (How Your Site Looks)
# ===========================================================================

title: "Vicente K. Pedreros Aballay"
tagline: "cosmology · simulations · dark energy · modified gravity"
author: "Vicente K. Pedreros Aballay"
description: >-
  I am Vicente (not Vincent!), a late-time cosmologist interested in studying the large-scale structure of the Universe. My research focuses on understanding the accelerated expansion of the universe, and its connection to modified theories of gravity. Currently at QUT for my PhD in Astrophysics.
url: "https://vpedreros.github.io"
toc: true
baseurl: ""

# ===========================================================================
# 3. Personal Information & Social Media (Who You Are)
# ===========================================================================

# GitHub integration
github:
  username: vpedreros

# Social profile information (used for SEO/structured data — see _data/profile.yml for site UI)
social:
  name: Vicente K. Pedreros Aballay
  links:
    - https://github.com/vpedreros

# =========================
# 4. External Services & SEO (Configure these later when needed)
# =========================

# Search Engine Verification (configure when you want to track site performance)
webmaster_verifications:
  google: # Add Google Search Console verification code later
  bing: # Add Bing Webmaster Tools verification code later
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics (configure when you want to see site statistics)
analytics:
  google:
    id: # Add Google Analytics 4 Measurement ID later (e.g., G-XXXXXXXXXX)
  goatcounter:
    id: # Add GoatCounter site code later (privacy-friendly option)
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page view counter
pageviews:
  provider: # Set to 'goatcounter' if using GoatCounter analytics

# CDN for media files (leave empty unless using external CDN)
cdn:

# =========================
# 5. Advanced Technical Settings (Don't modify unless you know what you're doing)
# =========================

# Jekyll plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown processing settings
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Collections configuration
collections:
  tabs:
    output: true
    sort_by: order
  projects:
    output: true
    permalink: /projects/:path/

# Default settings for different content types
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/common/Background.jpg
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: projects
    values:
      layout: post
      toc: true

# CSS compilation settings
sass:
  style: compressed
  encoding: utf-8

# HTML compression settings
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Files to exclude from build
exclude:
  - "*.gem"
  - "*.gemspec"
  - _archive/
  - docs
  - tools
  - AGENTS.md
  - claude.md
  - README.md
  - LICENSE
  - CLAUDE.md
  - DESIGN.md
  - ASSET-LICENSES.md
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .claude/
